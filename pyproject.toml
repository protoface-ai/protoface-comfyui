[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "protoface-nodes"
version = "0.1.0"
description = "Official Protoface API nodes for ComfyUI with automatic full-catalog coverage. Video generation with MiniMax H3, LTX 2.5 Fast, Seedance, Kling, Veo, Runway and Luma. Image generation and editing with FLUX, Nano Banana, GPT Image and Qwen. Music, speech and 3D generation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["httpx>=0.27,<1", "jsonschema>=4.23,<5", "Pillow>=10", "av>=14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "build>=1", "packaging>=24", "pathspec>=0.12,<2", "tomli>=2; python_version<'3.11'"]

[project.urls]
Repository = "https://github.com/protoface-ai/protoface-comfyui"
Documentation = "https://github.com/protoface-ai/protoface-comfyui/blob/master/docs/installation.md"
"Bug Tracker" = "https://github.com/protoface-ai/protoface-comfyui/issues"
Issues = "https://github.com/protoface-ai/protoface-comfyui/issues"
Homepage = "https://protoface.com"

[tool.comfy]
# Registered, immutable Comfy Registry publisher identity.
PublisherId = "protoface"
DisplayName = "Protoface"
requires-comfyui = ">=0.41.0"

[tool.hatch.build.targets.wheel]
packages = ["protoface_comfyui"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_examples.py" = ["E402"]
"scripts/release.py" = ["E402"]
