[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "protoface-nodes"
version = "0.1.0"
description = "Schema-generated Protoface media API nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "jsonschema>=4.23,<5", "Pillow>=10", "av>=14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "build>=1"]

[project.urls]
Repository = "https://github.com/protoface-ai/protoface-comfyui"
Documentation = "https://docs.protoface.com"

[tool.comfy]
DisplayName = "Protoface"
requires-comfyui = ">=0.41.0"

[tool.hatch.build.targets.wheel]
packages = ["protoface_comfyui"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_examples.py" = ["E402"]
