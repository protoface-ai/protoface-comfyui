name: Checks
on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source ref to check for a release
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ inputs.ref || github.sha }}'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_public_content.py
      - run: ruff check . && ruff format --check .
      - run: python scripts/sync_catalog.py protoface_comfyui/data/catalog.json --check
      - run: python scripts/release.py check
      - run: pytest tests/test_catalog.py tests/test_client.py tests/test_release.py
      - run: python -m build
      - name: Check built archives for private state and credentials
        run: python -c "import pathlib,subprocess,sys; subprocess.run([sys.executable,'scripts/check_public_content.py',*[arg for p in pathlib.Path('dist').iterdir() if p.is_file() for arg in ('--archive',str(p))]],check=True)"
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        comfy-ref:
          - bdc63e72f5ab29fde448c161db3057827148c0ef
          - 63be2f9b82ad0dac88a7ceaa28a9cf3154125a18
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ inputs.ref || github.sha }}'
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: '${{ matrix.comfy-ref }}'
          path: .comfy-test
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r .comfy-test/requirements.txt -e '.[dev]'
      - run: python -m pytest
        env:
          COMFYUI_PATH: '${{ github.workspace }}/.comfy-test'
      - run: python scripts/generate_examples.py
        if: runner.os == 'Linux'
        env:
          COMFYUI_PATH: '${{ github.workspace }}/.comfy-test'
      - run: git diff --exit-code -- example_workflows examples/api
        if: runner.os == 'Linux'
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ inputs.ref || github.sha }}'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' 'comfy-cli==1.22.0'
      - run: python scripts/release.py build --verify-cli
      - uses: actions/upload-artifact@v4
        with:
          name: protoface-source-${{ github.run_id }}
          path: |
            dist/protoface-nodes-*.zip
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
